name: APK készítése

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle comes from here, so the gradlew script in the repo is not needed for CI.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: APK fordítása
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Átnevezés
        run: cp app/build/outputs/apk/release/app-release.apk Hasnaplo.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Hasnaplo-apk
          path: Hasnaplo.apk
