name: APK készítése

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK fordítása
        run: ./gradlew --no-daemon assembleRelease

      - name: Átnevezés
        run: cp app/build/outputs/apk/release/app-release.apk Hasnaplo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hasnaplo-apk
          path: Hasnaplo.apk
